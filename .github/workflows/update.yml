name: update

# follows the latest release of romirr/puppet; no secrets needed beyond the repo's own GITHUB_TOKEN
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo romirr/puppet --json tagName --jq .tagName)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          case "$tag" in *-*) echo "prerelease $tag, skipping"; exit 0 ;; esac
          python3 render.py scoop "$tag" "https://github.com/romirr/puppet/releases/download/$tag/SHA256SUMS" bucket/puppet.json
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "puppet $TAG"
          git push
